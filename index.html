<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────────────────── HEADER ───────────────────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <span id="greeting-text">Good morning</span>,
        <span id="user-name" class="editable-name" title="Click to edit name">Friend</span>
        <button class="icon-btn" id="edit-name-btn" title="Edit name" aria-label="Edit name">✏️</button>
      </div>
      <div class="topbar-center">
        <div id="clock" class="clock"></div>
        <div id="date" class="date-display"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- Name edit modal -->
    <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
      <div class="modal-box">
        <h2 id="name-modal-title">What's your name?</h2>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="30" />
        <div class="modal-actions">
          <button id="name-save-btn" class="btn btn-primary">Save</button>
          <button id="name-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ───────────────────────── MAIN ───────────────────────── -->
    <main class="dashboard">

      <!-- ── FOCUS TIMER ── -->
      <section class="card timer-card" aria-labelledby="timer-heading">
        <div class="card-header">
          <h2 id="timer-heading">Focus Timer</h2>
          <button class="icon-btn" id="timer-settings-btn" title="Change duration" aria-label="Change timer duration">⚙️</button>
        </div>

        <div class="timer-display" aria-live="polite" aria-atomic="true">
          <span id="timer-minutes">25</span><span class="timer-sep">:</span><span id="timer-seconds">00</span>
        </div>

        <div class="timer-controls">
          <button class="btn btn-primary" id="timer-start">Start</button>
          <button class="btn btn-secondary" id="timer-stop" disabled>Stop</button>
          <button class="btn btn-ghost" id="timer-reset">Reset</button>
        </div>

        <!-- Timer settings panel -->
        <div id="timer-settings-panel" class="settings-panel hidden">
          <label for="timer-duration-input">Session length (minutes)</label>
          <input id="timer-duration-input" type="number" min="1" max="120" value="25" />
          <button class="btn btn-primary btn-sm" id="timer-duration-save">Apply</button>
        </div>
      </section>

      <!-- ── TO-DO LIST ── -->
      <section class="card todo-card" aria-labelledby="todo-heading">
        <div class="card-header">
          <h2 id="todo-heading">To-Do List</h2>
          <span id="todo-count" class="badge">0</span>
        </div>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="120" aria-label="New task" />
          <button type="submit" class="btn btn-primary" aria-label="Add task">Add</button>
        </form>

        <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>

        <div class="todo-footer">
          <button class="btn btn-ghost btn-sm" id="clear-done-btn">Clear completed</button>
        </div>
      </section>

      <!-- ── QUICK LINKS ── -->
      <section class="card links-card" aria-labelledby="links-heading">
        <div class="card-header">
          <h2 id="links-heading">Quick Links</h2>
        </div>

        <form id="link-form" class="link-form" autocomplete="off">
          <input id="link-name-input" type="text" placeholder="Label" maxlength="30" aria-label="Link label" />
          <input id="link-url-input" type="url" placeholder="https://…" aria-label="Link URL" />
          <button type="submit" class="btn btn-primary" aria-label="Add link">Add</button>
        </form>

        <div id="links-grid" class="links-grid" role="list" aria-label="Quick links"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
