<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ───────────── GREETING ───────────── -->
  <header class="greeting-section">
    <p id="datetime" class="datetime"></p>
    <h1 id="greeting" class="greeting"></h1>
  </header>

  <!-- ───────────── MAIN GRID ───────────── -->
  <main class="grid">

    <!-- FOCUS TIMER -->
    <section class="card" id="timer-card">
      <h2 class="card-title">Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop" class="btn btn-secondary">Stop</button>
        <button id="timer-reset" class="btn btn-ghost">Reset</button>
      </div>
      <p class="timer-label" id="timer-label">Ready to focus?</p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card" id="todo-card">
      <h2 class="card-title">To-Do List</h2>
      <div class="todo-input-row">
        <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="120" />
        <button id="todo-add" class="btn btn-primary">Add</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <p class="todo-empty" id="todo-empty">No tasks yet. Add one above!</p>
    </section>

    <!-- QUICK LINKS -->
    <section class="card" id="links-card">
      <h2 class="card-title">Quick Links</h2>
      <div class="links-input-row">
        <input id="link-name" type="text" placeholder="Label" maxlength="30" />
        <input id="link-url" type="url" placeholder="https://…" maxlength="200" />
        <button id="link-add" class="btn btn-primary">Add</button>
      </div>
      <div id="links-grid" class="links-grid"></div>
      <p class="links-empty" id="links-empty">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- EDIT TASK MODAL -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Edit task" hidden>
    <div class="modal">
      <h3>Edit Task</h3>
      <input id="edit-input" type="text" maxlength="120" />
      <div class="modal-actions">
        <button id="edit-save" class="btn btn-primary">Save</button>
        <button id="edit-cancel" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
